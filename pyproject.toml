[project]
name = "geosquare-platform"
version = "0.1.0"
description = "GeoSquare platform: import tables with GID columns, store them as cells, draw them on a map."
requires-python = ">=3.11"
dependencies = [
  "geosquare-engine>=0.1.0",
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geosquare_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The engine is not on PyPI yet. Build it from git (needs Rust).
[tool.uv.sources]
geosquare-engine = { git = "ssh://git@github.com/geosquareai/geosquare-engine.git", subdirectory = "bindings/python" }
