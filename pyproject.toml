[project]
name = "geosquare-platform"
version = "0.1.0"
description = "GeoSquare platform: import tables with GID columns, store them as cells, draw them on a map."
requires-python = ">=3.11"
dependencies = [
  "geosquare-engine>=0.2.0,<0.3",
  "geosquare-v2[table,registry,geo]==1.3.0",
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "geosquare-grid==1.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geosquare_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
